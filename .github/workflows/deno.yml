name: Deno

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deno:
    name: Deno CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run linter
        run: deno lint

      - name: Type check
        shell: bash
        run: |
          set -e

          TS_FILES=$(find . \
            -type f \
            \( -name "*.ts" -o -name "*.tsx" \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*")

          if [ -n "$TS_FILES" ]; then
            echo "TypeScript files found:"
            echo "$TS_FILES"
            echo "Running type check..."
            deno check --all $TS_FILES
          else
            echo "No TypeScript files found."
            echo "Skipping type check."
          fi

      - name: Run tests
        shell: bash
        run: |
          set -e

          TEST_FILES=$(find . \
            -type f \
            \( \
              -name "*_test.ts" \
              -o -name "*_test.tsx" \
              -o -name "*.test.ts" \
              -o -name "*.test.tsx" \
            \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*")

          if [ -n "$TEST_FILES" ]; then
            echo "Test modules found:"
            echo "$TEST_FILES"
            echo "Running tests..."
            deno test --allow-all
          else
            echo "No test modules found."
            echo "Skipping tests because no test files exist yet."
          fi
