name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run linter
        run: deno lint

      - name: Run tests
        shell: bash
        run: |
          TEST_FILES=$(find . \
            -type f \
            \( -name "*_test.ts" -o -name "*_test.tsx" -o -name "*.test.ts" -o -name "*.test.tsx" \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*")

          if [ -n "$TEST_FILES" ]; then
            echo "Test files found:"
            echo "$TEST_FILES"
            deno test -A
          else
            echo "No test files found. Skipping tests."
          fi
