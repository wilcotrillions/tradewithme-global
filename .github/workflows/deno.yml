name: Deno

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deno:
    name: Deno CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno lint
        run: deno lint auth.js

      - name: Check for Deno tests
        shell: bash
        run: |
          set -e

          TEST_FILES=$(find . \
            -type f \
            \( \
              -name "*_test.ts" \
              -o -name "*_test.tsx" \
              -o -name "*.test.ts" \
              -o -name "*.test.tsx" \
            \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            2>/dev/null || true)

          if [ -n "$TEST_FILES" ]; then
            echo "Test modules found:"
            echo "$TEST_FILES"
            deno test --allow-all
          else
            echo "No Deno test modules found."
            echo "Skipping tests."
          fi
