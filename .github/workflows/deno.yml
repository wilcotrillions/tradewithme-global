name: Deno

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deno:
    name: Deno CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Type check
        shell: bash
        run: |
          if find . \
            -type f \
            \( -name "*.ts" -o -name "*.tsx" \) \
            -not -path "./.git/*" \
            | grep -q .; then
            echo "TypeScript files found. Running type check..."
            deno check --all \
              $(find . \
                -type f \
                \( -name "*.ts" -o -name "*.tsx" \) \
                -not -path "./.git/*")
          else
            echo "No TypeScript files found. Skipping type check."
          fi

      - name: Run tests
        shell: bash
        run: |
          TEST_FILES=$(find . \
            -type f \
            \( \
              -name "*_test.ts" \
              -o -name "*_test.tsx" \
              -o -name "*.test.ts" \
              -o -name "*.test.tsx" \
            \) \
            -not -path "./.git/*")

          if [ -n "$TEST_FILES" ]; then
            echo "Test modules found:"
            echo "$TEST_FILES"
            echo "Running tests..."
            deno test --allow-all
          else
            echo "No test modules found."
            echo "No tests are configured yet."
            echo "Skipping test execution."
          fi
