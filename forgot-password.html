<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Reset Password | TradeWithMe Global
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

  <div class="auth-wrapper">

    <div class="auth-card">

      <a
        href="login.html"
        class="back-home"
      >
        ← Back to Login
      </a>

      <a
        href="index.html"
        class="logo"
      >
        TradeWith<span>Me</span>
      </a>

      <h1>
        Reset password
      </h1>

      <p class="subtitle">
        Enter your email address to request a password reset.
      </p>

      <div
        id="message"
        class="message"
      ></div>

      <form id="forgotForm">

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>

        <button
          type="submit"
          class="btn btn-primary"
        >
          Reset Password
        </button>

      </form>

      <div class="auth-links">

        <a href="login.html">
          Back to Login
        </a>

        <a href="register.html">
          Create Account
        </a>

      </div>

      <div class="auth-footer">
        Password reset email delivery will be connected to the real backend later.
      </div>

    </div>

  </div>

  <script src="auth.js"></script>

</body>

</html>
