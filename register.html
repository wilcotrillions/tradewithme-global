<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Create Account | TradeWithMe Global
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

  <div class="auth-wrapper">

    <div class="auth-card">

      <a
        href="index.html"
        class="back-home"
      >
        ← Back to TradeWithMe
      </a>

      <a
        href="index.html"
        class="logo"
      >
        TradeWith<span>Me</span>
      </a>

      <h1>
        Create your account
      </h1>

      <p class="subtitle">
        Join TradeWithMe Global and start your trading education journey.
      </p>

      <div
        id="message"
        class="message"
      ></div>

      <form id="registerForm">

        <div class="form-group">

          <label for="name">
            Full name
          </label>

          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              placeholder="Minimum 8 characters"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              data-target="password"
            >
              Show
            </button>

          </div>

        </div>

        <div class="form-group">

          <label for="confirmPassword">
            Confirm password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="confirmPassword"
              placeholder="Repeat your password"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              data-target="confirmPassword"
            >
              Show
            </button>

          </div>

        </div>

        <button
          class="btn btn-primary"
          type="submit"
        >
          Create Account
        </button>

      </form>

      <div class="auth-links">

        <a href="login.html">
          Already have an account?
        </a>

        <a href="forgot-password.html">
          Forgot password?
        </a>

      </div>

      <div class="auth-footer">
        Demo authentication only. Real secure authentication will be connected in the backend stage.
      </div>

    </div>

  </div>

  <script src="auth.js"></script>

</body>

</html>
